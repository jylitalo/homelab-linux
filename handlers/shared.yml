- name: Restart systemd-modules-load
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ k3s_host_modules }}"

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Restart NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: restarted
