- name: Setup Fedora Workstation
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Configure system hostname
      ansible.builtin.hostname:
        name: "touchbar"
    - name: Import shared tasks
      ansible.builtin.import_tasks:
        file: tasks/shared.yml
    - name: Additional workstate packages
      ansible.builtin.dnf:
        name:
          - alacritty
          - age
          - btop
          - conky
          - grimshot
          - libu2f-host
          - niri
          - noctalia
          - pass
          - pcsc-lite
          - pcsc-lite-ccid
          - python3-pip
          - python3-i3ipc
          - sway
          - sway-systemd
          - waybar
          - zathura
          - zathura-pdf-mupdf
        state: present
    - name: Configure kubecolor repository
      ansible.builtin.yum_repository:
        name: kubecolor
        description: Kubecolor RPM repository
        baseurl: https://kubecolor.github.io/packages/rpm/
        enabled: false
        gpgcheck: true
        gpgkey: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x62acb02733c915f1

    - name: Install specific kubecolor version
      ansible.builtin.dnf:
        name: kubecolor-0.8.0-1
        state: present
        enablerepo:
          - kubecolor

    - name: Install autotiling via pip for user
      ansible.builtin.pip:
        name: autotiling
        extra_args: --user
        state: present
      become_user: jylitalo
    - name: Add Flathub
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
    - name: Install Logseq
      community.general.flatpak:
        name: com.logseq.Logseq
        state: present
        remote: flathub
    - name: Import k3s server settings
      ansible.builtin.import_tasks:
        file: tasks/k3s-server.yml
  handlers:
    - name: Import shared handlers
      ansible.builtin.import_tasks:
        file: handlers/shared.yml
    - name: pcscd.socket enabled
      ansible.builtin.systemd_service:
        name: pcscd.socket
        state: started
        enabled: true
