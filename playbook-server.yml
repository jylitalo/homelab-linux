- name: Setup Fedora Server for k3s
  hosts: localhost
  connection: local
  become: true
  vars:
    ###
    # K3S
    ###
    k3s_host_modules:
      - br_netfilter
      - overlay
    kubeconfig: /root/.kube/config
    ###
    # FluxCD
    ###
    flux_release: 2.8.6
    git_repo: flux-config
    git_branch: main
  vars_files:
    - flux.vars
  tasks:
    - name: Configure system hostname
      ansible.builtin.hostname:
        name: "prodesk"
    - name: Import shared tasks
      ansible.builtin.import_tasks:
        file: tasks/shared.yml
    - name: Additional server packages
      ansible.builtin.dnf:
        name:
          - helm
          - samba
        state: present
    ###
    ## K3S requirements
    ###
    - name: Import k3s server settings
      ansible.builtin.import_tasks:
        file: tasks/k3s-server.yml

    - name: Runtime swap off (non-persistent)
      ansible.builtin.command: swapoff -a
      changed_when: false
    ###
    ## K3S installation
    ###
    - name: Install k3s
      ansible.builtin.command: files/k3s_install.sh --disable=traefik
      environment:
        INSTALL_K3S_VERSION: "v1.35.3+k3s1"
      args:
        creates: /usr/local/bin/k3s

    - name: Setup kubectl for root
      ansible.builtin.shell: |
        mkdir -p /root/.kube
        cp /etc/rancher/k3s/k3s.yaml "{{ kubeconfig }}"
      args:
        creates: "{{ kubeconfig }}"
    ###
    ## fluxcd setup
    ###
    - name: Check if flux SSH key exists
      ansible.builtin.stat:
        path: /root/.ssh/id_flux
      register: flux_key

    - name: Generate ECDSA SSH key for flux if missing
      ansible.builtin.command:
        cmd: ssh-keygen -t ecdsa -b 521 -N '' -f /root/.ssh/id_flux
        creates: /root/.ssh/id_flux
      when: not flux_key.stat.exists

    - name: Ensure fluxcd user exists
      ansible.builtin.user:
        name: fluxcd
        state: present
        create_home: true
        shell: /bin/bash

    - name: Directories for fluxcd
      ansible.builtin.file:
        path: "/home/fluxcd/{{ item }}"
        state: directory
        owner: fluxcd
        group: fluxcd
        mode: 0700
      loop:
        - .ansible/tmp
        - .ssh
        - gitops.git

    - name: Copy file with permissions
      ansible.builtin.copy:
        src: /root/.ssh/id_flux.pub
        dest: /home/fluxcd/.ssh/authorized_keys
        owner: fluxcd
        group: fluxcd
        mode: "0700"

    - name: Create repo
      ansible.builtin.command:
        cmd: git init --bare --initial-branch=main
        chdir: /home/fluxcd/gitops.git
        creates: /home/fluxcd/gitops.git/refs
      become: true
      become_user: fluxcd

    - name: Install flux
      ansible.builtin.command:
        cmd: files/flux-install.sh
        creates: /usr/local/bin/flux

    - name: Bootstrap fluxcd
      ansible.builtin.command:
        cmd: flux bootstrap git --url=ssh://fluxcd@git.ylitalot.com:22/home/fluxcd/gitops.git --branch=main --path=clusters/homelab --private-key-file=/root/.ssh/id_flux --silent
        creates: /home/fluxcd/gitops.git/clusters/homelab

  handlers:
    - name: Import shared handlers
      ansible.builtin.import_tasks:
        file: handlers/shared.yml
